name: Deploy - Production

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI - Lint & Test]
    types: [completed]
    branches: [main]

env:
  NODE_VERSION: "18"

permissions:
  contents: read
  deployments: write

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              required_contexts: [],
              auto_merge: false,
            });
            console.log('Deployment ID:', deployment.data.id);
            return deployment.data.id;

      - name: Update deployment status (in progress)
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'in_progress',
              description: 'Deploying to production environment...'
            });

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci -w backend -w frontend

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Run all tests
        run: npm test -w backend --passWithNoTests

      - name: Run security audit
        run: npm audit --production
        continue-on-error: true

      - name: Update deployment status (success)
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              description: 'Successfully deployed to production',
              environment_url: 'https://portfolio.example.com'
            });

      - name: Update deployment status (failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Deployment to production failed'
            });

      - name: Create release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v' + new Date().toISOString().split('T')[0];
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/' + tag,
              sha: context.sha
            }).catch(() => console.log('Tag already exists'));

      - name: Send notification
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            echo "🎉 Production deployment successful"
            echo "🌐 Visit: https://portfolio.example.com"
          else
            echo "❌ Production deployment failed"
          fi
